# Fly.io — Find the Game API (build from this directory: fly deploy)
app = 'game-finder-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADDR = ':8080'
  UPLOAD_DIR = '/data/uploads'
  SEED_DEMO = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Optional when R2 is unset; harmless if uploads use R2 only.
[[mounts]]
  source = 'uploads_data'
  destination = '/data'
