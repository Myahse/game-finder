name: Android release

# Builds the Google Play bundle (.aab) for mobile/. See docs/PLAY_STORE.md.
#
# Runs on every push that touches the app, and on demand from
# Actions → "Android release" → Run workflow.
#
# With the signing secrets below set, the bundle is signed with the upload key
# and ready to upload to Play Console. Without them it is a debug-signed check
# build (Play rejects it), which still proves the Android build works.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD       key password
#   GOOGLE_SERVICES_JSON       contents of google-services.json for com.outforground.app
#   MOBILE_ENV                 contents of mobile/assets/.env with production values

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release.yml'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: App config (assets/.env)
        run: |
          if [ -n "$MOBILE_ENV" ]; then
            printf '%s\n' "$MOBILE_ENV" > assets/.env
          else
            echo "::warning::MOBILE_ENV secret not set: building with assets/.env.example (production API, no Mapbox token, no Google sign-in)."
            cp assets/.env.example assets/.env
          fi

      - name: Firebase config (google-services.json)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set: using a placeholder (push notifications won't work in this build)."
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.outforground.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Upload key (key.properties)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "::warning::Signing secrets not set: this bundle is signed with the DEBUG key and Google Play will reject it."
          fi

      - run: flutter pub get

      # versionName comes from pubspec.yaml; versionCode is the run number, so
      # every bundle built here is higher than the last one uploaded.
      - name: Build app bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Signing certificate and permissions
        run: |
          echo "### Signing certificate" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA1|SHA256" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Permissions in the merged manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$manifest" | sed 's/.*android:name=//' | sort -u >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la build/app/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: outforground-${{ env.KEYSTORE_BASE64 != '' && 'release' || 'debug-signed' }}-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
